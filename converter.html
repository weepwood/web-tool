<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL 与时间戳转换 · Tools</title><link rel="icon" href="favicon.svg"><style>
:root{color-scheme:light dark;--bg:#fff;--text:#37352f;--muted:#787774;--line:#e3e2df;--panel:#f7f7f5;--blue:#2383e2}@media(prefers-color-scheme:dark){:root{--bg:#191919;--text:#e8e6e3;--muted:#a3a3a3;--line:#393939;--panel:#222;--blue:#4ea1ff}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1000px;margin:auto;padding:40px 24px}a{color:var(--blue);text-decoration:none}h1{margin:20px 0 4px;font-size:30px}p{color:var(--muted)}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:24px 0 16px}button,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:7px}button{cursor:pointer}button.primary{background:#2383e2;color:white;border-color:#2383e2}button:disabled{opacity:.5;cursor:default}.editors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{font-weight:600}textarea{display:block;width:100%;min-height:200px;resize:vertical;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel);color:var(--text);font:14px/1.6 ui-monospace,Menlo,monospace}#status{overflow-wrap:anywhere;min-height:24px}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}@media(max-width:700px){main{padding:24px 16px}.editors{grid-template-columns:1fr}textarea{min-height:140px}}
</style></head><body><main><a href="index.html">← 返回工具集</a><h1>URL 与时间戳转换</h1><p>本地处理，不上传数据。URL 编码针对单个组件而非整个链接；时间统一使用 UTC，明确选择秒或毫秒。</p><div class="bar"><label for="mode">转换方式</label><select id="mode"><option value="encode">URL 组件编码</option><option value="decode">URL 组件解码</option><option value="form-decode">表单解码（+ 为空格）</option><option value="seconds">Unix 秒 → UTC</option><option value="milliseconds">Unix 毫秒 → UTC</option><option value="iso">UTC ISO → Unix</option></select><button class="primary" id="run">转换</button><button id="sample">示例</button><button id="now">当前毫秒</button><button id="copy" disabled>复制结果</button></div><div class="editors"><div><label for="source">输入</label><textarea id="source" spellcheck="false"></textarea></div><div><label for="out">结果</label><textarea id="out" readonly spellcheck="false"></textarea></div></div><p id="status" role="status">等待输入</p></main><script type="module">
import {transformText} from "./convert-core.mjs";
const $=id=>document.getElementById(id), mode=$("mode"), source=$("source"), out=$("out"), copy=$("copy"), status=$("status");
function reset(){out.value="";copy.disabled=true;status.textContent="等待转换";}
function run(){try{out.value=transformText(source.value,mode.value);copy.disabled=false;status.textContent="转换成功";}catch(e){out.value="";copy.disabled=true;status.textContent="转换失败："+e.message;}}
mode.onchange=reset;source.oninput=reset;$("run").onclick=run;$("sample").onclick=()=>{source.value=({encode:"你好 & +",decode:"%E4%BD%A0%20%26", "form-decode":"hello+world%2B",seconds:"0",milliseconds:"0",iso:"2026-01-01T00:00:00Z"})[mode.value];run();};$("now").onclick=()=>{mode.value="milliseconds";source.value=Date.now();run();};copy.onclick=async()=>{try{await navigator.clipboard.writeText(out.value);status.textContent="已复制";}catch{out.focus();out.select();status.textContent="请手动复制选中的文本";}};
</script></body></html>
