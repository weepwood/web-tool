<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Hub | 创意工具集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e5e5e5;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .search-gradient {
            background: linear-gradient(90deg, #7000ff, #00d1ff);
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <nav class="sticky top-0 z-50 backdrop-blur-xl border-b border-white/10 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 search-gradient rounded-lg flex items-center justify-center">
                <i data-lucide="zap" class="text-white w-5 h-5"></i>
            </div>
            <span class="font-bold text-xl tracking-tight">CREATIVE HUB</span>
        </div>
        
        <div class="hidden md:flex items-center bg-white/5 border border-white/10 px-4 py-2 rounded-full w-96 hover:bg-white/10 transition-all cursor-pointer">
            <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
            <span class="ml-3 text-sm text-gray-500">搜索工具或资源... (Ctrl + K)</span>
        </div>

        <div class="flex items-center gap-4">
            <button class="p-2 hover:bg-white/10 rounded-full transition-colors"><i data-lucide="bell" class="w-5 h-5 text-gray-400"></i></button>
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500"></div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-12">
        <div class="flex gap-8">
            
            <aside class="w-48 hidden lg:block shrink-0">
                <p class="text-xs font-semibold text-gray-500 mb-6 uppercase tracking-widest">分类浏览</p>
                <ul class="space-y-4">
                    <li class="flex items-center gap-3 text-blue-400 font-medium cursor-pointer"><i data-lucide="layout-grid" class="w-4 h-4"></i> 全部工具</li>
                    <li class="flex items-center gap-3 text-gray-400 hover:text-white transition-colors cursor-pointer"><i data-lucide="sparkles" class="w-4 h-4"></i> AI 创作</li>
                    <li class="flex items-center gap-3 text-gray-400 hover:text-white transition-colors cursor-pointer"><i data-lucide="palette" class="w-4 h-4"></i> 视觉设计</li>
                    <li class="flex items-center gap-3 text-gray-400 hover:text-white transition-colors cursor-pointer"><i data-lucide="code-2" class="w-4 h-4"></i> 开发助手</li>
                    <li class="flex items-center gap-3 text-gray-400 hover:text-white transition-colors cursor-pointer"><i data-lucide="file-text" class="w-4 h-4"></i> 内容营销</li>
                </ul>
            </aside>

            <div class="flex-1">
                <div class="flex justify-between items-end mb-8">
                    <h1 class="text-3xl font-semibold">推荐工具</h1>
                    <span class="text-sm text-gray-500">显示 12 个项目</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    
                    <div class="glass-card p-5 rounded-2xl group cursor-pointer">
                        <div class="flex justify-between mb-4">
                            <div class="p-3 bg-purple-500/20 rounded-xl text-purple-400 group-hover:bg-purple-500/30">
                                <i data-lucide="image"></i>
                            </div>
                            <button class="text-gray-600 hover:text-yellow-400"><i data-lucide="star" class="w-5 h-5"></i></button>
                        </div>
                        <h3 class="text-lg font-semibold mb-1">Midjourney Prompt</h3>
                        <p class="text-sm text-gray-500 leading-relaxed mb-4">最先进的 AI 绘画提示词生成器，支持风格预设。</p>
                        <div class="flex gap-2">
                            <span class="px-2 py-1 text-[10px] bg-white/5 rounded border border-white/10 text-gray-400 uppercase">AI</span>
                            <span class="px-2 py-1 text-[10px] bg-white/5 rounded border border-white/10 text-gray-400 uppercase">Image</span>
                        </div>
                    </div>

                    <div class="glass-card p-5 rounded-2xl group cursor-pointer">
                        <div class="flex justify-between mb-4">
                            <div class="p-3 bg-cyan-500/20 rounded-xl text-cyan-400 group-hover:bg-cyan-500/30">
                                <i data-lucide="droplet"></i>
                            </div>
                            <button class="text-gray-600 hover:text-yellow-400"><i data-lucide="star" class="w-5 h-5"></i></button>
                        </div>
                        <h3 class="text-lg font-semibold mb-1">Mesh Gradient</h3>
                        <p class="text-sm text-gray-500 leading-relaxed mb-4">在线生成高斯模糊弥散光影背景，支持代码导出。</p>
                        <div class="flex gap-2">
                            <span class="px-2 py-1 text-[10px] bg-white/5 rounded border border-white/10 text-gray-400 uppercase">Design</span>
                            <span class="px-2 py-1 text-[10px] bg-white/5 rounded border border-white/10 text-gray-400 uppercase">Code</span>
                        </div>
                    </div>

                    <div class="glass-card p-5 rounded-2xl group cursor-pointer">
                        <div class="flex justify-between mb-4">
                            <div class="p-3 bg-amber-500/20 rounded-xl text-amber-400 group-hover:bg-amber-500/30">
                                <i data-lucide="file-json"></i>
                            </div>
                            <button class="text-gray-600 hover:text-yellow-400"><i data-lucide="star" class="w-5 h-5"></i></button>
                        </div>
                        <h3 class="text-lg font-semibold mb-1">JSON Formatter</h3>
                        <p class="text-sm text-gray-500 leading-relaxed mb-4">极简的 JSON 格式化与校验工具，支持暗黑模式。</p>
                        <div class="flex gap-2">
                            <span class="px-2 py-1 text-[10px] bg-white/5 rounded border border-white/10 text-gray-400 uppercase">Dev</span>
                            <span class="px-2 py-1 text-[10px] bg-white/5 rounded border border-white/10 text-gray-400 uppercase">Format</span>
                        </div>
                    </div>

                    </div>
            </div>
        </div>
    </main>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-2 p-2 bg-white/10 backdrop-blur-2xl border border-white/20 rounded-2xl shadow-2xl">
        <div class="px-4 py-2 hover:bg-white/10 rounded-xl cursor-pointer transition-colors flex items-center gap-2">
            <i data-lucide="pencil-line" class="w-4 h-4"></i>
            <span class="text-sm">灵感便签</span>
        </div>
        <div class="w-px h-6 bg-white/10"></div>
        <div class="px-4 py-2 hover:bg-white/10 rounded-xl cursor-pointer transition-colors flex items-center gap-2">
            <i data-lucide="clipboard" class="w-4 h-4"></i>
            <span class="text-sm">暂存区 (0)</span>
        </div>
        <div class="w-px h-6 bg-white/10"></div>
        <div class="px-4 py-2 hover:bg-white/10 rounded-xl cursor-pointer transition-colors flex items-center gap-2">
            <i data-lucide="command" class="w-4 h-4"></i>
            <span class="text-sm">快捷键</span>
        </div>
    </div>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();
        
        // 模拟键盘快捷键监听
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                alert('呼出全局搜索面板！');
            }
        });
    </script>
</body>
</html>
