<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发辅助实验室 · Tools</title><link rel="icon" href="favicon.svg"><style>
:root{color-scheme:light dark;--bg:#fff;--text:#37352f;--muted:#787774;--line:#e3e2df;--panel:#f7f7f5;--blue:#2383e2}@media(prefers-color-scheme:dark){:root{--bg:#191919;--text:#e8e6e3;--muted:#aaa;--line:#393939;--panel:#222;--blue:#4ea1ff}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:32px 20px}a{color:var(--blue);text-decoration:none}h1{margin-bottom:4px}p{color:var(--muted)}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}button,input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 12px}button{cursor:pointer}button.primary{background:#2383e2;color:white;border-color:#2383e2}textarea{display:block;width:100%;min-height:160px;resize:vertical;font-family:ui-monospace,monospace}label{display:block;font-weight:600;margin:10px 0 6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:70px;max-height:480px;overflow:auto;font-family:ui-monospace,monospace}.add{color:#18864b;background:#18864b15}.remove{color:#d14949;background:#d1494915}.same{color:var(--muted)}#swatch{width:60px;height:38px;border:1px solid var(--line);border-radius:7px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}[hidden]{display:none!important}@media(max-width:650px){.cols{grid-template-columns:1fr}main{padding:20px 14px}}
</style></head><body><main><a href="index.html">← 返回工具集</a><h1>开发辅助实验室</h1><p>正则测试、逐行文本差异、HEX 颜色转换；全部本地处理。</p><div class="bar"><label for="mode">工具</label><select id="mode"><option value="regex">正则表达式</option><option value="diff">文本差异</option><option value="color">颜色转换</option></select><button class="primary" id="run">运行</button><button id="sample">示例</button><button id="copy" disabled>复制结果</button></div>
<section id="regex"><div class="cols"><div><label for="pattern">表达式（不含斜杠）</label><input id="pattern" value="(foo)" maxlength="500"></div><div><label for="flags">标志（gimsu）</label><input id="flags" value="gi" maxlength="5"></div></div><label for="input">待匹配文本</label><textarea id="input" maxlength="20000" spellcheck="false"></textarea><p>正则运行在独立 Worker 中，超过 1.5 秒自动终止；最多显示 500 项。</p></section>
<section id="diff" hidden><div class="cols"><div><label for="before">原文</label><textarea id="before" maxlength="100000"></textarea></div><div><label for="after">修改后</label><textarea id="after" maxlength="100000"></textarea></div></div><p>按行比较，每侧最多 400 行；换行统一为 LF。</p></section>
<section id="color" hidden><label for="hex">HEX 颜色</label><div class="bar"><input id="hex" value="#2383e2" maxlength="7"><input id="picker" type="color" value="#2383e2" aria-label="选择颜色"><div id="swatch" aria-label="颜色预览"></div></div></section>
<p id="status" role="status">等待输入</p><pre id="output" class="result"></pre></main><script type="module">
import {colorFormats,diffLines} from "./lab-core.mjs";
const $=id=>document.getElementById(id),mode=$("mode"),output=$("output"),status=$("status"),copy=$("copy");
let worker=null,timer=null,result="";
function stop(){if(worker)worker.terminate();worker=null;clearTimeout(timer);timer=null;}
function reset(){stop();result="";output.replaceChildren();copy.disabled=true;status.textContent="等待处理";}
function show(text){result=text;output.textContent=text;copy.disabled=false;status.textContent="处理完成";}
function fail(message){result="";output.replaceChildren();copy.disabled=true;status.textContent="处理失败："+message;}
function run(){reset();try{
if(mode.value==="regex"){status.textContent="匹配中…";worker=new Worker("./regex-worker.mjs",{type:"module"});worker.onmessage=e=>{stop();if(e.data.error)fail(e.data.error);else{show(JSON.stringify(e.data.matches,null,2));status.textContent="显示 "+e.data.matches.length+" 项"+(e.data.matches.length===500?"（已达上限）":"");}};worker.onerror=()=>{stop();fail("Worker 无法运行");};timer=setTimeout(()=>{stop();fail("表达式执行超时");},1500);worker.postMessage({pattern:$("pattern").value,flags:$("flags").value,input:$("input").value});}
else if(mode.value==="color"){const c=colorFormats($("hex").value);$("swatch").style.background=c.hex;$("picker").value=c.hex;show([c.hex,c.rgb,c.hsl].join("\n"));}
else{const rows=diffLines($("before").value,$("after").value);const prefix={same:"  ",add:"+ ",remove:"- "};result=rows.map(r=>prefix[r.type]+r.text).join("\n");for(const row of rows){const el=document.createElement("div");el.className=row.type;el.textContent=prefix[row.type]+row.text;output.append(el);}copy.disabled=false;status.textContent="新增 "+rows.filter(r=>r.type==="add").length+" 行 · 删除 "+rows.filter(r=>r.type==="remove").length+" 行";}
}catch(e){stop();fail(e.message);}}
mode.onchange=()=>{for(const id of ["regex","diff","color"])$(id).hidden=id!==mode.value;reset();};document.querySelectorAll("textarea,input").forEach(el=>el.addEventListener("input",reset));$("picker").oninput=()=>{$("hex").value=$("picker").value;run();};$("run").onclick=run;$("sample").onclick=()=>{if(mode.value==="regex"){$("pattern").value="(foo)";$("flags").value="gi";$("input").value="Foo bar foo";}else if(mode.value==="diff"){$("before").value="alpha\nbeta";$("after").value="alpha\ngamma";}else{$("hex").value="#2383e2";}run();};copy.onclick=async()=>{try{await navigator.clipboard.writeText(result);status.textContent="已复制";}catch{status.textContent="无法自动复制，请手动选择结果";}};
</script></body></html>
