<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tools - Notion Style</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --notion-bg: #ffffff;
            --notion-text: #37352f;
            --notion-secondary: #787774;
            --notion-border: rgba(55, 53, 47, 0.16);
            --notion-hover-bg: rgba(55, 53, 47, 0.03);
            --notion-blue: #2383e2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: var(--notion-bg);
            color: var(--notion-text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            padding: 80px 40px;
        }

        /* 标题部分 */
        header {
            margin-bottom: 48px;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .description {
            color: var(--notion-secondary);
            font-size: 16px;
        }

        /* 工具卡片网格 */
        #tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            border-top: 1px solid var(--notion-border);
            padding-top: 32px;
        }

        .tool-card {
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--notion-border);
            border-radius: 6px;
            padding: 16px;
            transition: background 120ms ease-in;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }

        .tool-card:hover {
            background-color: var(--notion-hover-bg);
        }

        .tool-card h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-card p {
            font-size: 14px;
            color: var(--notion-secondary);
            margin: 0;
            line-height: 1.5;
        }

        .tool-footer {
            margin-top: 16px;
            font-size: 12px;
            color: var(--notion-blue);
            font-weight: 500;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 120ms ease-in;
        }

        .tool-card:hover .tool-footer {
            opacity: 1;
        }

        /* 移动端优化 */
        @media (max-width: 640px) {
            .main-container { padding: 40px 20px; }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <h1><span id="page-icon">🛠️</span> <span id="page-title">Tools</span></h1>
        <p class="description">个人知识管理与生产力工具集</p>
    </header>

    <div id="tools-grid">
        </div>
</div>

<script>
    // 1. JSON 数据配置：在这里增加或修改工具
    const toolsData = [
        {
            title: "ASS 字幕文本提取",
            desc: "提取字幕中的文本，用于后续 AI 处理",
            url: "subtitle-converter.html",
            icon: "📝"
        },
            {
            title: "Notion 导出 csv 解析",
            desc: "Notion 导出 csv 解析并展示工具",
            url: "notion-csv-parser.html",
            icon: "📚"
        },
        {
            title: "语雀导出工具",
            desc: "导出语雀知识库，支持 Markdown 格式",
            url: "https://weepwood-yuque-export.netlify.app",
            icon: "📑"
        },
        {
            title: "URL Scheme 转换",
            desc: "将 URL Scheme 转换为标准的 HTTP URL",
            url: "https://weepwood-scheme-to-url.netlify.app",
            icon: "🔗"
        },
        {
            title: "Spine 动画预览",
            desc: "Spine 动画在线展示与调试工具",
            url: "https://weepwood-spine.netlify.app",
            icon: "💃"
        }
    ];

    // 2. 渲染函数
    function renderTools() {
        const grid = document.getElementById('tools-grid');
        grid.innerHTML = toolsData.map(tool => `
            <a href="${tool.url}" class="tool-card">
                <div>
                    <h3><span>${tool.icon}</span> ${tool.title}</h3>
                    <p>${tool.desc}</p>
                </div>
                <div class="tool-footer">打开页面 →</div>
            </a>
        `).join('');
    }

    // 初始化加载
    document.addEventListener('DOMContentLoaded', renderTools);
</script>

</body>
</html>
