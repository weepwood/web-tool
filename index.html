<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="color-scheme" content="light dark" />
	<title>My Tools</title>
	<link rel="icon" type="image/svg+xml" href="favicon.svg" />

	<style>
		:root{
			--bg: #ffffff;
			--text: #37352f;
			--muted: #787774;

			--border: rgba(55, 53, 47, 0.16);
			--hover: rgba(55, 53, 47, 0.03);

			--blue: #2383e2;
			--shadow: 0 8px 24px rgba(15, 15, 15, 0.08);
			--radius: 10px;
		}

		@media (prefers-color-scheme: dark){
			:root{
				--bg: #191919;
				--text: rgba(255,255,255,0.9);
				--muted: rgba(255,255,255,0.65);

				--border: rgba(255,255,255,0.14);
				--hover: rgba(255,255,255,0.06);

				--blue: #4ea1ff;
				--shadow: 0 10px 30px rgba(0,0,0,0.45);
			}
		}

		* { box-sizing: border-box; }

		body{
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
			background: var(--bg);
			color: var(--text);
			margin: 0;
			padding: 0;
			display: flex;
			justify-content: center;
		}

		a{ color: inherit; }

		.main-container{
			width: 100%;
			max-width: 980px;
			padding: 72px 40px;
		}

		/* 标题部分 */
		header{ margin-bottom: 40px; }
		h1{
			font-size: 40px;
			line-height: 1.15;
			font-weight: 720;
			letter-spacing: -0.02em;
			margin: 0 0 10px 0;
			display: flex;
			align-items: center;
			gap: 12px;
		}
		.description{
			color: var(--muted);
			font-size: 15px;
			line-height: 1.6;
			margin: 0;
		}

		/* 工具卡片网格 */
		#tools-grid{
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
			gap: 14px;
			border-top: 1px solid var(--border);
			padding-top: 28px;
		}

		.tool-card{
			text-decoration: none;
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 16px 16px 14px;
			background: transparent;

			display: flex;
			flex-direction: column;
			justify-content: space-between;
			min-height: 124px;

			transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
			outline: none;
		}

		.tool-card:hover{
			background: var(--hover);
			transform: translateY(-2px);
			box-shadow: var(--shadow);
			border-color: rgba(35, 131, 226, 0.25);
		}

		.tool-card:active{
			transform: translateY(-1px);
		}

		.tool-card:focus-visible{
			box-shadow: 0 0 0 3px rgba(35, 131, 226, 0.35);
			border-color: rgba(35, 131, 226, 0.55);
		}

		.tool-card h3{
			font-size: 16px;
			font-weight: 650;
			margin: 0 0 8px 0;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.tool-icon{
			width: 22px;
			display: inline-flex;
			justify-content: center;
		}

		.tool-icon svg{
			width: 18px;
			height: 18px;
			color: var(--blue);
		}

		#page-icon svg{
			width: 22px;
			height: 22px;
			color: var(--blue);
		}

		.tool-card p{
			font-size: 13px;
			color: var(--muted);
			margin: 0;
			line-height: 1.55;
		}

		.tool-footer{
			margin-top: 14px;
			font-size: 12px;
			color: var(--blue);
			font-weight: 600;
			display: inline-flex;
			align-items: center;
			gap: 6px;

			opacity: 0.72;
			transition: opacity 120ms ease, transform 120ms ease;
		}

		.tool-card:hover .tool-footer{
			opacity: 1;
			transform: translateX(2px);
		}

		/* 移动端优化 */
		@media (max-width: 640px){
			.main-container{ padding: 40px 18px; }
			h1{ font-size: 30px; }
			#tools-grid{ grid-template-columns: 1fr; }
		}
	</style>
</head>

<body>

		<header>
			<h1>
				<span id="page-icon" aria-hidden="true">🛠️</span>
				<span id="page-title">Tools</span>

			<p class="description" id="page-desc">个人知识管理与生产力工具集</p>

		<div id="tools-grid" aria-label="工具列表"></div>

		};

		const pageConfig = {
			title: "Tools",
			iconSvg: ICON.wrench,
			description: "个人知识管理与生产力工具集",
		};

		const toolsData = [
			{ title: "开发辅助实验室", desc: "正则测试、逐行文本差异、HEX/RGB/HSL 转换", url: "developer-lab.html", iconSvg: ICON.wrench },
			{ title: "URL 与时间戳转换", desc: "URL 组件编解码、表单解码与 UTC 时间转换", url: "converter.html", iconSvg: ICON.link },
			{ title: "JSON 格式化", desc: "本地校验、格式化及压缩 JSON", url: "json-formatter.html", iconSvg: ICON.fileText },
			{ title: "ASS 字幕文本提取", desc: "提取字幕中的文本，用于后续 AI 处理", url: "subtitle-converter.html", iconSvg: ICON.fileText },
			{ title: "Notion 导出 csv 解析", desc: "Notion 导出 csv 解析并展示工具", url: "notion-csv-parser.html", iconSvg: ICON.table },
			{ title: "语雀导出工具", desc: "导出语雀知识库，支持 Markdown 格式", url: "https://weepwood-yuque-export.netlify.app", iconSvg: ICON.fileDown, external: true },
			{ title: "URL Scheme 转换", desc: "将 URL Scheme 转换为标准的 HTTP URL", url: "https://weepwood-scheme-to-url.netlify.app", iconSvg: ICON.link, external: true },
			{ title: "Spine 动画预览", desc: "Spine 动画在线展示与调试工具", url: "https://weepwood-spine.netlify.app", iconSvg: ICON.play, external: true },
			{ title: "待办清单", desc: "极简待办管理（ZenTask）", url: "todo.html", iconSvg: ICON.checkSquare },
			{ title: "Pomodoro", desc: "Fluent UI 番茄钟", url: "pomodoro.html", iconSvg: ICON.timer },
			{ title: "Snake", desc: "经典贪吃蛇小游戏", url: "snake.html", iconSvg: ICON.gameController },
		];

		function applyPageConfig(){
			document.title = pageConfig.title;
			document.getElementById("page-title").textContent = pageConfig.title;
			document.getElementById("page-icon").innerHTML = pageConfig.iconSvg;
			document.getElementById("page-desc").textContent = pageConfig.description;
		}

		function createToolCard(tool){
			const a = document.createElement("a");
			a.className = "tool-card";
			a.href = tool.url;
			a.setAttribute("aria-label", `打开：${tool.title}`);

			// 外链：新开 + 安全
			if (tool.external){
				a.target = "_blank";
				a.rel = "noopener noreferrer";
			}

			const top = document.createElement("div");

			const h3 = document.createElement("h3");
			const icon = document.createElement("span");
			icon.className = "tool-icon";
			if (tool.iconSvg){
				icon.innerHTML = tool.iconSvg;
			} else {
				icon.textContent = tool.icon || "🔧";
			}

			const title = document.createElement("span");
			title.textContent = tool.title;

			h3.appendChild(icon);
			h3.appendChild(title);

			const p = document.createElement("p");
			p.textContent = tool.desc || "";

			top.appendChild(h3);
			top.appendChild(p);

			const footer = document.createElement("div");
			footer.className = "tool-footer";
			footer.textContent = tool.external ? "打开外部页面" : "打开页面";
			const arrow = document.createElement("span");
			arrow.textContent = "→";
			footer.appendChild(arrow);

			a.appendChild(top);
			a.appendChild(footer);
			return a;
		}

		function renderTools(){
			const grid = document.getElementById("tools-grid");
			grid.replaceChildren(...toolsData.map(createToolCard));
		}

		document.addEventListener("DOMContentLoaded", () => {
			applyPageConfig();
			renderTools();
		});
	</script>
</body>
</html>
